name: split_by_asc
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - r-base=4.5.2
  # Bioconductor dependencies
  - bioconda::bioconductor-rhtslib
  - bioconda::bioconductor-rsamtools
  # System/build libraries needed by Rhtslib/Rsamtools
  - conda-forge::zlib
  - conda-forge::bzip2
  - conda-forge::xz
  - conda-forge::liblzma-devel
  - conda-forge::libcurl
  - conda-forge::openssl
  - conda-forge::make
  - conda-forge::compilers
  # R packages needed by scripts in cdr3_similarity module
  - conda-forge::r-pak
  - conda-forge::r-r.utils
  - conda-forge::r-dplyr
  - conda-forge::r-tidyr
  - conda-forge::r-readr
  - conda-forge::r-airr
  - conda-forge::r-data.table
  - conda-forge::r-argparse
